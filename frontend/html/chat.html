<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <title>DA-IICT Faculty &amp; Staff AI Buddy</title>
    <meta name="description" content="DAU Buddy Chat — Ask anything about DA-IICT faculty and staff">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Chat Stylesheet (only) -->
    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>
    <div class="chat-app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <i class="fa-solid fa-graduation-cap logo-icon"></i>
                    <h2>DAU Buddy</h2>
                </div>
                <span class="badge">AI</span>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" id="new-chat-btn">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Chat</span>
                </button>
                <div class="chat-history-list" id="chat-history-list">
                    <!-- Dynamically rendered -->
                </div>
            </div>

            <div class="sidebar-footer">
                <!-- Profile Button -->
                <div class="profile-container" id="profile-container" style="position: relative; margin-bottom: 12px; width: 100%;">
                    <div id="nav-profile-trigger" style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 12px; border-radius: 8px; transition: background 0.2s; width: 100%; box-sizing: border-box; background: rgba(15, 59, 115, 0.06); border: 1px solid var(--border);">
                        <img id="sidebar-avatar" src="https://lh3.googleusercontent.com/a/default-user" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brand);" referrerpolicy="no-referrer">
                        <div style="display: flex; flex-direction: column; overflow: hidden; text-align: left; flex: 1;">
                            <span id="sidebar-name" style="font-weight: 600; font-size: 14px; color: var(--txt-primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">User</span>
                        </div>
                        <i class="fa-solid fa-ellipsis" style="font-size: 14px; color: var(--txt-muted);"></i>
                    </div>

                    <!-- Profile Dropdown (pops upward) -->
                    <div id="profile-dropdown" class="profile-dropdown"
                        style="display: none; flex-direction: column; position: absolute; bottom: 54px; left: 0; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); width: 100%; box-sizing: border-box; z-index: 1000; overflow: hidden;">
                        <div class="profile-info"
                            style="position: relative; padding: 24px; text-align: center; border-bottom: 1px solid #f0f0f0;">
                            <button id="close-profile-btn"
                                style="position: absolute; top: 16px; right: 20px; background: transparent; border: none; cursor: pointer; font-size: 18px; color: #555; transition: color 0.2s;"><i
                                    class="fa-solid fa-xmark"></i></button>
                            <img id="dropdown-avatar" src="https://lh3.googleusercontent.com/a/default-user"
                                referrerpolicy="no-referrer"
                                style="width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--brand); margin-bottom: 12px; object-fit: cover;">
                            <h3 id="dropdown-name"
                                style="margin: 0 0 4px 0; font-size: 18px; color: var(--txt-primary); font-weight: 600;">
                                Welcome!</h3>
                            <p id="dropdown-email"
                                style="margin: 0 0 8px 0; font-size: 14px; color: var(--txt-secondary);">
                                Authenticated User</p>
                            <span id="dropdown-role"
                                style="display: inline-block; background: #e0f2fe; color: #0284c7; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid #bae6fd;">Role</span>
                        </div>
                        <div class="profile-actions" style="padding: 8px;">
                            <button onclick="window.location.href='/api-keys'"
                                style="width: 100%; padding: 12px 16px; background: transparent; border: none; text-align: left; cursor: pointer; font-size: 15px; color: var(--txt-primary); border-radius: 8px; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: background 0.2s;">
                                <i class="fa-solid fa-key" style="color: var(--txt-secondary); font-size: 18px;"></i> API Keys
                            </button>
                            <button id="logout-btn"
                                style="width: 100%; padding: 12px 16px; background: transparent; border: none; text-align: left; cursor: pointer; font-size: 15px; color: var(--txt-primary); border-radius: 8px; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: background 0.2s;">
                                <i class="fa-solid fa-arrow-right-from-bracket" style="color: var(--txt-secondary); font-size: 18px;"></i> Sign out
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Clear History -->
                <button class="clear-history-btn" id="clear-history-btn">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Clear History</span>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="top-nav">
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="nav-center">DAU Buddy</div>
            </header>

            <!-- Viewport -->
            <div class="chat-viewport" id="chat-viewport">

                <!-- Welcome screen -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h2>How can I help you today?</h2>
                    <p class="welcome-sub">
                        Ask anything about DA-IICT — faculty, staff, holidays, timetables, library books, academic rules, PhD scholars, and more.
                    </p>

                    <div class="prompt-grid">
                        <button class="prompt-card" data-prompt="I want a faculty for machine learning">
                            <i class="fa-solid fa-robot card-icon"></i>
                            <div class="card-text">
                                <h4>Find Experts</h4>
                                <p>"Faculty for machine learning"</p>
                            </div>
                        </button>
                        <button class="prompt-card" data-prompt="When is the next holiday?">
                            <i class="fa-solid fa-calendar-days card-icon"></i>
                            <div class="card-text">
                                <h4>Upcoming Holidays</h4>
                                <p>"When is the next holiday?"</p>
                            </div>
                        </button>
                        <button class="prompt-card" data-prompt="What is Prof. Anil Agarwal's schedule on Monday?">
                            <i class="fa-solid fa-clock card-icon"></i>
                            <div class="card-text">
                                <h4>Faculty Timetable</h4>
                                <p>"Prof. Agarwal's schedule on Monday"</p>
                            </div>
                        </button>
                        <button class="prompt-card" data-prompt="Find me a book on computer networks">
                            <i class="fa-solid fa-book card-icon"></i>
                            <div class="card-text">
                                <h4>Library Search</h4>
                                <p>"Book on computer networks"</p>
                            </div>
                        </button>
                        <button class="prompt-card" data-prompt="What is the minimum CPI required for BTech graduation?">
                            <i class="fa-solid fa-file-lines card-icon"></i>
                            <div class="card-text">
                                <h4>Academic Rules</h4>
                                <p>"Minimum CPI for graduation"</p>
                            </div>
                        </button>
                        <button class="prompt-card" data-prompt="Search PhD scholars working on NLP">
                            <i class="fa-solid fa-user-graduate card-icon"></i>
                            <div class="card-text">
                                <h4>PhD Scholars</h4>
                                <p>"Scholars working on NLP"</p>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div class="messages-container" id="messages-container"></div>
            </div>

            <!-- Input -->
            <footer class="input-area">
                <form class="input-form" id="input-form">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="user-input"
                            placeholder="Ask about a faculty member, specialization, or staff role…"
                            autocomplete="off"
                        >
                        <button type="submit" class="send-btn" id="send-btn" title="Send">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
                <div class="input-disclaimer">
                    <p>DAU Buddy answers based on real-time data scraped from
                        <a href="https://www.daiict.ac.in" target="_blank" rel="noopener">daiict.ac.in</a>
                    </p>
                </div>
            </footer>
        </main>
    </div>

    <!-- Chat JS (loaded once) -->
    <script src="/js/chat.js"></script>

    <!-- Profile Dropdown Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authStr = localStorage.getItem('dau_buddy_auth');
            if (authStr) {
                try {
                    const auth = JSON.parse(authStr);
                    document.getElementById('sidebar-avatar').src = auth.picture || 'https://lh3.googleusercontent.com/a/default-user';
                    document.getElementById('sidebar-name').textContent = auth.name || 'User';
                    document.getElementById('dropdown-avatar').src = auth.picture || 'https://lh3.googleusercontent.com/a/default-user';
                    document.getElementById('dropdown-name').textContent = auth.name || 'Welcome!';
                    document.getElementById('dropdown-email').textContent = auth.email || '';
                    document.getElementById('dropdown-role').textContent = auth.role || 'User';
                } catch(e) {}
            } else {
                window.location.href = '/?view=login';
            }

            const trigger = document.getElementById('nav-profile-trigger');
            const dropdown = document.getElementById('profile-dropdown');
            const closeBtn = document.getElementById('close-profile-btn');
            const logoutBtn = document.getElementById('logout-btn');

            if(trigger && dropdown) {
                trigger.addEventListener('click', () => {
                    dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
                });
            }
            if(closeBtn && dropdown) {
                closeBtn.addEventListener('click', () => {
                    dropdown.style.display = 'none';
                });
            }
            if(logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('dau_buddy_auth');
                    window.location.href = '/?view=login';
                });
            }

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (dropdown && trigger && !trigger.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
